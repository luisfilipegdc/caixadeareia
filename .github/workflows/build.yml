name: Empacotar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Executável Windows
    runs-on: windows-latest
    permissions:
      contents: write   # necessário para anexar o .exe à release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # O driver do Kinect é um módulo nativo que só compila em máquina com o
      # SDK do sensor instalado — o runner do GitHub não tem. Por isso ele
      # fica de fora do executável público, que sai com o modo demonstração
      # completo e pronto para falar com uma ponte externa. Ver README.
      - name: Instalar dependências
        run: npm install --omit=optional --no-audit --no-fund

      - name: Gerar o .exe
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: CaixaDeAreia-windows
          path: dist/*.exe
          if-no-files-found: error

      # Push de tag v* publica o executável direto na aba Releases.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  ponte-kinect-v1:
    name: Ponte Kinect v1 (C#)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Compila sem o SDK do Kinect instalado: a biblioteca do sensor é
      # carregada por reflexão em tempo de execução, então o CI consegue
      # verificar o código mesmo sem hardware nem SDK.
      - name: Compilar a ponte
        run: dotnet build ponte-windows-v1/PonteKinect.csproj -c Release -o dist-ponte

      - uses: actions/upload-artifact@v4
        with:
          name: PonteKinect-v1-windows
          path: dist-ponte/PonteKinect.exe
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-ponte/PonteKinect.exe

  publicar-web:
    name: Publicar versão web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
